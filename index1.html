
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison | Restaurant Menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f5ed;
            color: #203d30;
            font-family: "DM Sans", sans-serif;
        }

        header {
            background: #203d30;
            color: #f8f5ed;
            text-align: center;
            padding: 55px 20px 45px;
        }

        .brand {
            color: #d7bd82;
            letter-spacing: 5px;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        header h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(42px, 8vw, 68px);
            font-weight: 500;
        }

        header p {
            margin-top: 14px;
            color: #dedfd5;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .intro {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .intro h2 {
            font-family: "Playfair Display", serif;
            font-size: 36px;
            font-weight: 500;
        }

        .intro p {
            color: #777d72;
            margin-top: 10px;
            font-size: 14px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 20px 35px;
        }

        .category-btn {
            padding: 10px 20px;
            border: 1px solid #c9cbbd;
            background: transparent;
            color: #203d30;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font: inherit;
            font-size: 13px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #203d30;
            color: white;
            border-color: #203d30;
        }

        .menu-grid {
            width: min(1100px, 90%);
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
            padding-bottom: 60px;
        }

        .food-card {
            background: #fffdf8;
            border: 1px solid #e9e3d6;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .food-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px #203d3012;
        }

        .food-image {
            width: 100%;
            height: 205px;
            object-fit: cover;
            display: block;
            background: #e8e4d9;
        }

        .food-info {
            padding: 21px;
        }

        .food-category {
            color: #a17d39;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .food-info h3 {
            font-family: "Playfair Display", serif;
            font-size: 23px;
            font-weight: 500;
            margin: 9px 0;
        }

        .description {
            color: #777d72;
            font-size: 12px;
            line-height: 1.7;
            min-height: 41px;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 19px;
        }

        .price {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
        }

        .add-btn {
            background: #203d30;
            color: white;
            border: none;
            padding: 10px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .add-btn:hover {
            background: #355844;
        }

        .cart {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: #203d30;
            color: white;
            border: 1px solid #bda46d;
            border-radius: 40px;
            padding: 15px 22px;
            cursor: pointer;
            box-shadow: 0 5px 20px #0002;
            font: inherit;
        }

        footer {
            background: #203d30;
            color: #e8e4d9;
            text-align: center;
            padding: 30px 15px;
            font-size: 12px;
            line-height: 2;
        }

        footer strong {
            color: #d7bd82;
            letter-spacing: 3px;
        }

        @media (max-width: 850px) {
            .menu-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .menu-grid {
                grid-template-columns: 1fr;
                width: 88%;
                gap: 20px;
            }

            .food-image {
                height: 230px;
            }

            .intro h2 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">Maison · Fine Dining</div>
        <h1>Maison</h1>
        <p>GOOD FOOD. BEAUTIFUL MOMENTS.</p>
    </header>

    <section class="intro">
        <h2>Our Menu</h2>
        <p>Thoughtfully prepared, beautifully served.</p>
    </section>

    <nav class="categories" id="categories"></nav>

    <main class="menu-grid" id="menuGrid"></main>

    <button class="cart" id="cartBtn">
        My Order · <span id="cartCount">0</span>
    </button>

    <footer>
        <strong>MAISON</strong>
        <p>Made with love, served with elegance.</p>
        <p>Open daily · 12 PM – 11 PM</p>
    </footer>

    <script>
        const dishes = [
            {
                name: "Truffle Pasta",
                category: "Main Course",
                price: 1250,
                description: "Creamy parmesan sauce with herbs and truffle.",
                image: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Classic Burger",
                category: "Main Course",
                price: 950,
                description: "Juicy grilled patty, fresh greens and house sauce.",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Margherita Pizza",
                category: "Main Course",
                price: 1400,
                description: "Mozzarella, basil and our signature tomato sauce.",
                image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Garden Salad",
                category: "Starters",
                price: 650,
                description: "Crisp seasonal greens with a refreshing dressing.",
                image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Chocolate Cake",
                category: "Desserts",
                price: 550,
                description: "Rich chocolate layers with silky ganache.",
                image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Iced Coffee",
                category: "Drinks",
                price: 450,
                description: "Chilled espresso blended with creamy milk.",
                image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=700&q=80"
            }
        ];

        const menuGrid = document.querySelector("#menuGrid");
        const categories = document.querySelector("#categories");
        const cartCount = document.querySelector("#cartCount");
        const cartBtn = document.querySelector("#cartBtn");

        let selectedCategory = "All";
        let orderCount = 0;
        let order = [];

        function showCategories() {
            const categoryNames = [
                "All",
                ...new Set(dishes.map(dish => dish.category))
            ];

            categories.innerHTML = categoryNames.map(category => `
                <button
                    class="category-btn ${category === selectedCategory ? "active" : ""}"
                    data-category="${category}">
                    ${category}
                </button>
            `).join("");
        }

        function showMenu() {
            const filteredDishes = selectedCategory === "All"
                ? dishes
                : dishes.filter(dish => dish.category === selectedCategory);

            menuGrid.innerHTML = filteredDishes.map((dish, index) => `
                <article class="food-card">
                    <img
                        class="food-image"
                        src="${dish.image}"
                        alt="${dish.name}"
                        loading="lazy">

                    <div class="food-info">
                        <span class="food-category">${dish.category}</span>
                        <h3>${dish.name}</h3>
                        <p class="description">${dish.description}</p>

                        <div class="food-bottom">
                            <span class="price">
                                Rs. ${dish.price.toLocaleString("en-PK")}
                            </span>

                            <button class="add-btn" data-name="${dish.name}">
                                + Add
                            </button>
                        </div>
                    </div>
                </article>
            `).join("");
        }

        categories.addEventListener("click", function(event) {
            const button = event.target.closest("[data-category]");

            if (!button) return;

            selectedCategory = button.dataset.category;

            showCategories();
            showMenu();
        });

        menuGrid.addEventListener("click", function(event) {
            const button = event.target.closest("[data-name]");

            if (!button) return;

            const dish = dishes.find(
                item => item.name === button.dataset.name
            );

            order.push(dish);
            orderCount++;

            cartCount.textContent = orderCount;
            button.textContent = "✓ Added";

            setTimeout(() => {
                button.textContent = "+ Add";
            }, 900);
        });

        cartBtn.addEventListener("click", function() {
            if (order.length === 0) {
                alert("Your order is empty. Add a dish first!");
                return;
            }

            const summary = order.map(
                dish => `${dish.name} — Rs. ${dish.price}`
            ).join("\n");

            const total = order.reduce(
                (sum, dish) => sum + dish.price, 0
            );

            alert(
                "YOUR ORDER\n\n" +
                summary +
                "\n\nTotal: Rs. " + total.toLocaleString("en-PK")
            );
        });

        showCategories();
        showMenu();
    </script>

</body>
</html>
